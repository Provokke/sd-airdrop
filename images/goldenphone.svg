<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="18" y="8" width="28" height="48" rx="4" ry="4" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Screen -->
  <rect x="22" y="16" width="20" height="24" rx="2" ry="2" fill="#000000"/>
  
  <!-- Screen glow -->
  <rect x="23" y="17" width="18" height="22" rx="1" ry="1" fill="#1a1a1a"/>
  
  <!-- Signal bars -->
  <rect x="25" y="19" width="2" height="3" fill="#00FF00"/>
  <rect x="28" y="18" width="2" height="4" fill="#00FF00"/>
  <rect x="31" y="17" width="2" height="5" fill="#00FF00"/>
  <rect x="34" y="16" width="2" height="6" fill="#00FF00"/>
  
  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="4" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="1" fill="#FFD700"/>
  
  <!-- Keypad -->
  <circle cx="26" cy="44" r="2" fill="#B8860B"/>
  <circle cx="32" cy="44" r="2" fill="#B8860B"/>
  <circle cx="38" cy="44" r="2" fill="#B8860B"/>
  
  <!-- Speaker -->
  <ellipse cx="32" cy="12" rx="6" ry="2" fill="#B8860B"/>
  
  <!-- Microphone -->
  <ellipse cx="32" cy="52" rx="4" ry="1" fill="#B8860B"/>
</svg>