<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="18" y="8" width="28" height="48" rx="4" ry="4" fill="url(#greenGradient)" stroke="#006400" stroke-width="1"/>
  
  <!-- Screen -->
  <rect x="22" y="16" width="20" height="24" rx="2" ry="2" fill="#000000"/>
  
  <!-- Screen glow -->
  <rect x="23" y="17" width="18" height="22" rx="1" ry="1" fill="#1a1a1a"/>
  
  <!-- Signal bars -->
  <rect x="25" y="19" width="2" height="3" fill="#00FF00"/>
  <rect x="28" y="18" width="2" height="4" fill="#00FF00"/>
  <rect x="31" y="17" width="2" height="5" fill="#00FF00"/>
  <rect x="34" y="16" width="2" height="6" fill="#00FF00"/>
  
  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="4" stroke="#006400" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="1" fill="#32CD32"/>
  
  <!-- Keypad -->
  <circle cx="26" cy="44" r="2" fill="#006400"/>
  <circle cx="32" cy="44" r="2" fill="#006400"/>
  <circle cx="38" cy="44" r="2" fill="#006400"/>
  
  <!-- Speaker -->
  <ellipse cx="32" cy="12" rx="6" ry="2" fill="#006400"/>
  
  <!-- Microphone -->
  <ellipse cx="32" cy="52" rx="4" ry="1" fill="#006400"/>
  
  <!-- Leaf symbol -->
  <path d="M30 25 Q32 23 34 25 Q32 27 30 25" fill="#90EE90" stroke="#006400" stroke-width="0.5"/>
  <path d="M30 30 Q32 28 34 30 Q32 32 30 30" fill="#90EE90" stroke="#006400" stroke-width="0.5"/>
</svg>